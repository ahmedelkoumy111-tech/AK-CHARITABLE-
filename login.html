<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AK Charitable Organization</title>
    <link rel="stylesheet" href="login.css">
    <script src="enhanced-interactions.js" defer></script>
</head>
<body>

    <header>
        <img src="img/Logo.png" alt="AK Charitable Organization Logo">
        <h1>Login</h1>
    </header>

    <section class="form-container">
        <form action="dashboard.html" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <div class="or">OR</div>

        <!-- Google Login Button -->
        <a href="#" class="google-btn">
            Login with Google
        </a>

        <p>Don't have an account? <a href="singup.html">Sign Up</a></p>
    </section>

</body>
</html>
